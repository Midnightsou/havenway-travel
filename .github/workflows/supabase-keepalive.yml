name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Supabase through the API
        env:
          KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
        run: |
          if [ -z "$KEEPALIVE_TOKEN" ]; then
            echo "Missing SUPABASE_KEEPALIVE_TOKEN repository secret."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            --max-time 30 \
            --header "Authorization: Bearer $KEEPALIVE_TOKEN" \
            https://api.havenway-travels.cv/api/keepalive
